<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>חתימת מייל — שרה עאמר</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef0f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1f2433;display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 16px 56px}
.head{text-align:center;max-width:520px}.ey{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#235891;font-weight:700;margin:0 0 6px}.head h1{margin:0;font-size:21px;font-weight:800}.head p{margin:7px 0 0;font-size:13px;color:#6b7280;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:30px 34px;box-shadow:0 14px 36px rgba(40,55,145,.12),0 2px 6px rgba(0,0,0,.06);max-width:520px;width:100%}
.btn{appearance:none;border:0;cursor:pointer;background:#235891;color:#fff;font-size:15px;font-weight:700;padding:12px 26px;border-radius:10px;font-family:inherit;box-shadow:0 6px 16px rgba(40,55,145,.3)}.btn.ok{background:#059669}
.steps{max-width:520px;font-size:12.5px;color:#6b7280;line-height:1.8;text-align:center}.steps b{color:#1f2433}a.back{color:#6b7280;font-size:12px;text-decoration:none}</style></head>
<body><div class="head"><p class="ey">חתימת מייל · סטרים ליין — הנדסת תבניות</p><h1>שרה עאמר</h1><p>לחץ "העתק את החתימה" והדבק בהגדרות החתימה ב-Gmail. הלוגו מונפש.</p></div>
<div class="card"><div id="sig"><table dir="rtl" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:'Trebuchet MS','Segoe UI',Tahoma,sans-serif;">
  <tr>
    <td style="vertical-align:middle;padding-left:16px;"><img src="https://orelsabag.github.io/hamovil-signatures/logo-streams-line.gif" width="135" height="74" alt="סטרים ליין — הנדסת תבניות" style="display:block;border:0;"></td>
    <td style="vertical-align:middle;border-right:3px solid #e0a800;padding-right:16px;">
      <div style="font-size:16px;font-weight:bold;color:#235891;line-height:1.25;">שרה עאמר</div>
      <div style="font-size:11px;font-weight:bold;color:#b8860b;padding:2px 0 8px;">מחלקת מכירות סטריים ביק אופס</div>
      <div style="font-size:11.5px;color:#333;padding:1px 0;"><a href="tel:+972502013251" style="color:#235891;text-decoration:none;">050-201-3251</a></div>
      <div style="font-size:11.5px;color:#333;padding:1px 0;"><a href="mailto:office@stream-line.org.il" style="color:#235891;text-decoration:none;">office@stream-line.org.il</a></div>
    </td>
  </tr>
</table></div><div style="margin-top:24px;text-align:center;"><button id="copy" class="btn">📋 העתק את החתימה</button></div></div>
<div class="steps"><b>Gmail:</b> העתק ← ⚙ הגדרות ← "הצג את כל ההגדרות" ← חתימה ← חתימה חדשה ← הדבק ← שמור.</div>
<a class="back" href="https://orelsabag.github.io/hamovil-signatures/">← כל החתימות</a>
<script>var b=document.getElementById('copy');b.addEventListener('click',async function(){var h=document.getElementById('sig').innerHTML;try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'})})]);b.textContent='✓ הועתק! הדבק ב-Gmail';b.classList.add('ok');}catch(e){var r=document.createRange();r.selectNode(document.getElementById('sig'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');b.textContent='✓ הועתק!';b.classList.add('ok');}catch(_){b.textContent='סמן ידנית והעתק';}}});</script>
</body></html>
